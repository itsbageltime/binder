<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Binder</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: #0a0a0a; color: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
header { padding: 16px 20px 8px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
header .date { font-size: 12px; color: #555; }
.nav { display: flex; border-bottom: 1px solid #1a1a1a; flex-shrink: 0; }
.nav-btn { flex: 1; padding: 10px; background: none; border: none; color: #444; font-size: 12px; font-weight: 500; cursor: pointer; transition: color 0.2s; border-bottom: 2px solid transparent; }
.nav-btn.active { color: #f0f0f0; border-bottom-color: #f0f0f0; }
.content { flex: 1; overflow: hidden; position: relative; }
.feed-view { position: absolute; inset: 0; display: flex; flex-direction: column; }
.channels { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; border-bottom: 1px solid #111; }
.channels::-webkit-scrollbar { display: none; }
.channel-btn { padding: 5px 12px; border-radius: 20px; border: 1px solid #2a2a2a; background: transparent; color: #666; font-size: 12px; cursor: pointer; white-space: nowrap; transition: all 0.2s; flex-shrink: 0; }
.channel-btn.active { background: #f0f0f0; color: #0a0a0a; border-color: #f0f0f0; font-weight: 600; }
.refresh-timer { font-size: 11px; color: #555; padding: 4px 16px 2px; flex-shrink: 0; }
.feed-content { flex: 1; overflow: hidden; position: relative; }
.feed-pages { display: flex; height: 100%; width: 300%; will-change: transform; }
.feed-page { width: 33.333%; height: 100%; overflow-y: auto; padding: 10px 16px 32px; -webkit-overflow-scrolling: touch; flex-shrink: 0; }
.run-divider { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; }
.run-divider-line { flex: 1; height: 1px; background: #1a1a1a; }
.run-divider-label { font-size: 11px; color: #444; white-space: nowrap; flex-shrink: 0; }
.feed-card { background: #141414; border: 1px solid #1e1e1e; border-radius: 16px; padding: 18px 18px 16px; margin-bottom: 10px; user-select: none; position: relative; will-change: transform; }
.feed-card-channel { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #333; margin-bottom: 10px; }
.feed-card-insight { font-size: 17px; font-weight: 500; line-height: 1.5; color: #f0f0f0; margin-bottom: 12px; }
.feed-card-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.feed-card-byline { font-size: 12px; color: #444; }
.feed-card-expanded { display: none; padding-top: 16px; margin-top: 14px; border-top: 1px solid #1e1e1e; }
.feed-card-expanded.open { display: block; }
.feed-card-title { font-size: 13px; color: #555; line-height: 1.55; margin-bottom: 12px; }
.feed-card-context { font-size: 13px; color: #888; line-height: 1.65; margin-bottom: 14px; }
.journalist-btn { display: flex; align-items: center; gap: 10px; background: #1a1a1a; border: 1px solid #252525; border-radius: 12px; padding: 10px 14px; cursor: pointer; transition: border-color 0.2s; margin-bottom: 12px; width: 100%; text-align: left; }
.journalist-btn:hover { border-color: #333; }
.journalist-avatar { width: 32px; height: 32px; border-radius: 50%; background: #252525; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #888; flex-shrink: 0; }
.journalist-info { flex: 1; }
.journalist-name-text { font-size: 13px; font-weight: 500; color: #ccc; }
.journalist-pub-text { font-size: 11px; color: #555; margin-top: 2px; }
.journalist-arrow { color: #333; font-size: 14px; }
.read-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #4a9eff; text-decoration: none; border: 1px solid #1a3a5c; padding: 7px 14px; border-radius: 10px; }
.like-btn { background: transparent; border: none; padding: 6px 4px 6px 12px; font-size: 16px; cursor: pointer; color: #444; transition: color 0.15s; line-height: 1; }
.like-btn.liked { color: #4CAF50; }
.view { position: absolute; inset: 0; overflow-y: auto; padding: 16px 20px; display: none; }
.view.active { display: block; }
.deck-card { background: #141414; border: 1px solid #222; border-radius: 16px; padding: 18px; margin-bottom: 10px; }
.deck-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.deck-card-channel { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #444; }
.deck-remove { background: none; border: none; color: #333; font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
.deck-remove:hover { color: #888; }
.deck-card-insight { font-size: 16px; font-weight: 500; color: #f0f0f0; line-height: 1.4; margin-bottom: 10px; }
.deck-card-meta { font-size: 12px; color: #444; display: flex; justify-content: space-between; align-items: center; }
.roster-view-toggle { display: flex; gap: 6px; margin-bottom: 16px; }
.roster-toggle-btn { padding: 5px 12px; border-radius: 20px; border: 1px solid #2a2a2a; background: transparent; color: #555; font-size: 12px; cursor: pointer; transition: all 0.2s; }
.roster-toggle-btn.active { background: #1e1e1e; color: #f0f0f0; border-color: #444; }
.roster-section { margin-bottom: 24px; }
.roster-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #333; margin-bottom: 10px; }
.roster-item { display: flex; align-items: center; gap: 12px; background: #141414; border: 1px solid #1e1e1e; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
.roster-avatar { width: 36px; height: 36px; border-radius: 50%; background: #252525; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #888; flex-shrink: 0; }
.roster-info { flex: 1; }
.roster-name { font-size: 14px; font-weight: 500; color: #ccc; }
.roster-pub { font-size: 12px; color: #444; margin-top: 2px; }
.roster-channel { font-size: 10px; color: #333; text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }
.empty-state { text-align: center; padding: 60px 20px; color: #333; font-size: 14px; line-height: 1.8; }
.entity-btns { display: flex; gap: 8px; margin-bottom: 12px; }
.entity-btns .journalist-btn { flex: 1; width: auto; margin-bottom: 0; }
.voices-section-header { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #555; margin: 24px 0 10px; }
.voices-section-header:first-child { margin-top: 0; }
.journalist-panel { position: absolute; inset: 0; background: #0a0a0a; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); z-index: 10; overflow-y: auto; }
.journalist-panel.open { transform: translateY(0); }
.panel-inner { max-width: 560px; margin: 0 auto; padding: 24px 20px; }
.panel-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.panel-back { background: #1a1a1a; border: 1px solid #252525; border-radius: 10px; padding: 8px 14px; font-size: 13px; color: #888; cursor: pointer; }
.journalist-profile { display: flex; align-items: center; gap: 14px; background: #141414; border: 1px solid #1e1e1e; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
.profile-avatar { width: 52px; height: 52px; border-radius: 50%; background: #252525; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: #888; flex-shrink: 0; }
.profile-info { flex: 1; min-width: 0; }
.profile-name { font-size: 17px; font-weight: 600; color: #f0f0f0; }
.profile-pub { font-size: 13px; color: #555; margin-top: 3px; }
.profile-channel { font-size: 11px; color: #444; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
.follow-btn { background: #f0f0f0; color: #0a0a0a; border: none; border-radius: 20px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; flex-shrink: 0; white-space: nowrap; }
.follow-btn.following { background: #1e1e1e; color: #666; border: 1px solid #2a2a2a; }
.journalist-bio { font-size: 14px; color: #777; line-height: 1.65; margin-bottom: 28px; }
.panel-articles-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.panel-section { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #333; }
.panel-sort { display: flex; gap: 6px; }
.panel-sort-btn { padding: 4px 10px; border-radius: 20px; border: 1px solid #2a2a2a; background: transparent; color: #555; font-size: 11px; cursor: pointer; }
.panel-sort-btn.active { background: #1e1e1e; color: #f0f0f0; border-color: #444; }
.article-item { background: #141414; border: 1px solid #1e1e1e; border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; }
.article-item-insight { font-size: 13px; color: #ccc; line-height: 1.55; }
.article-item-meta { font-size: 11px; color: #444; margin-top: 6px; }
.panel-single-note { font-size: 12px; color: #2e2e2e; line-height: 1.6; padding: 12px 4px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<header>
  <h1>Binder</h1>
  <span class="date" id="dateLabel"></span>
</header>
<div class="nav">
  <button class="nav-btn active" onclick="switchView('feed',this)">Feed</button>
  <button class="nav-btn" onclick="switchView('deck',this)">Deck</button>
  <button class="nav-btn" onclick="switchView('voices',this)">Voices</button>
  <button class="nav-btn" onclick="switchView('archive',this)">Archive</button>
</div>
<div class="content">
  <div class="feed-view" id="feedView">
    <div class="channels" id="channels"></div>
    <div class="refresh-timer" id="refreshTimer"></div>
    <div class="feed-content" id="feedContent">
      <div class="feed-pages" id="feedPages">
        <div class="feed-page" id="pagePrev"></div>
        <div class="feed-page" id="pageCurrent"></div>
        <div class="feed-page" id="pageNext"></div>
      </div>
    </div>
  </div>
  <div class="view" id="deckView"><div id="deckContent"></div></div>
  <div class="view" id="voicesView">
    <div id="rosterContent"></div>
  </div>
  <div class="view" id="archiveView"><div id="archiveContent"></div></div>
  <div class="journalist-panel" id="journalistPanel">
    <div class="panel-inner">
      <div class="panel-header"><button class="panel-back" onclick="closeJournalist()">← Back</button></div>
      <div class="journalist-profile">
        <div class="profile-avatar" id="panelAvatar"></div>
        <div class="profile-info">
          <div class="profile-name" id="panelName"></div>
          <div class="profile-pub" id="panelPub"></div>
          <div class="profile-channel" id="panelChannel"></div>
        </div>
        <button class="follow-btn" id="followBtn" onclick="toggleFollow()">Follow</button>
      </div>
      <div class="journalist-bio" id="journalistBio"></div>
      <div class="panel-articles-header">
        <div class="panel-sort">
          <button class="panel-sort-btn active" onclick="sortPanelArticles('date',this)">Recent</button>
          <button class="panel-sort-btn" onclick="sortPanelArticles('channel',this)">Channel</button>
        </div>
        <span class="panel-section">In your feed</span>
      </div>
      <div id="panelArticles"></div>
    </div>
  </div>
  <div class="journalist-panel" id="publicationPanel">
    <div class="panel-inner">
      <div class="panel-header"><button class="panel-back" onclick="closePublication()">← Back</button></div>
      <div class="journalist-profile">
        <div class="profile-avatar" id="pubPanelAvatar"></div>
        <div class="profile-info">
          <div class="profile-name" id="pubPanelName"></div>
        </div>
        <button class="follow-btn" id="pubFollowBtn" onclick="togglePublicationFollow()">Follow</button>
      </div>
      <div class="journalist-bio" id="publicationBio"></div>
      <div class="panel-articles-header">
        <div class="panel-sort">
          <button class="panel-sort-btn active" id="pubSortDate" onclick="sortPubPanelArticles('date',this)">Recent</button>
          <button class="panel-sort-btn" id="pubSortChannel" onclick="sortPubPanelArticles('channel',this)">Channel</button>
        </div>
        <span class="panel-section">In your feed</span>
      </div>
      <div id="pubPanelArticles"></div>
    </div>
  </div>
</div>
<script>
var SUPABASE_URL='https://nbiwbvqbtyqvuzaklvcx.supabase.co';
var SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5iaXdidnFidHlxdnV6YWtsdmN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzA0NTcsImV4cCI6MjA5MjY0NjQ1N30.pooWsM3kVOcYb790LsEh5RQyJyn8g4mI28gsoXweW64';
var sb=(window.supabase&&SUPABASE_URL!=='YOUR_SUPABASE_URL')
  ?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

var allCards=[],activeChannel='all';
var likedUrls=new Set(),savedCards=[];
var followedJournalists={},currentJournalist=null;
var followedPublications={},currentPublication=null;
var panelRelated=[],panelSort='date';
var pubPanelRelated=[],pubPanelSort='date';

document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function normalizeCard(c){
  return{
    channel:c.channel||'',insight:c.insight||'',context:c.context||'',
    score:c.score||0,title:c.title||'',source:c.source||'',author:c.author||'',
    authorBio:c.author_bio||c.authorBio||'',pubDate:c.pub_date||c.pubDate||'',
    url:c.url||'',archiveOnly:c.archive_only||false,
    pipelineRun:c.pipeline_run||'',createdAt:c.created_at||''
  };
}

async function loadFollows(){
  if(!sb)return;
  try{
    var results=await Promise.all([
      sb.from('followed_journalists').select('name,publication'),
      sb.from('followed_publications').select('name')
    ]);
    var jRes=results[0],pRes=results[1];
    if(!jRes.error&&jRes.data){
      jRes.data.forEach(function(j){
        var key=j.name+'|'+j.publication;
        if(!followedJournalists[key])followedJournalists[key]={name:j.name,pub:j.publication,channel:''};
      });
    }
    if(!pRes.error&&pRes.data){
      pRes.data.forEach(function(p){followedPublications[p.name]=true;});
    }
  }catch(e){}
}

async function loadCards(){
  document.getElementById('pageCurrent').innerHTML='<div class="empty-state" style="color:#222">Loading...</div>';
  await loadFollows();
  console.log('[Binder] sb client:',sb?'ready':'null (window.supabase='+typeof window.supabase+')');
  if(sb){
    try{
      var sevenDaysAgo=new Date(Date.now()-7*24*3600*1000).toISOString().split('T')[0];
      console.log('[Binder] Fetching cards since',sevenDaysAgo);
      var res=await sb.from('cards').select('*').gte('pipeline_run',sevenDaysAgo).order('pipeline_run',{ascending:false}).order('score',{ascending:false}).range(0,2999);
      console.log('[Binder] Supabase response — error:',res.error,'| rows:',res.data&&res.data.length);
      if(!res.error&&res.data&&res.data.length>0){
        allCards=res.data.map(normalizeCard).filter(function(c){return!!c.insight;});
        console.log('[Binder] Loaded',allCards.length,'cards from Supabase');
        buildChannels();renderFeed();return;
      }
    }catch(e){console.error('[Binder] Supabase exception:',e);}
  }
  console.log('[Binder] Falling back to cards.json');
  try{
    var r=await fetch('cards.json');
    allCards=(await r.json()).map(normalizeCard).filter(function(c){return!!c.insight;});
    buildChannels();renderFeed();
  }catch(e){
    document.getElementById('pageCurrent').innerHTML='<div class="empty-state">Run node binder.js first.</div>';
  }
}

function buildChannels(){
  var topics=['all'].concat(Array.from(new Set(allCards.map(function(c){return c.channel;}))));
  document.getElementById('channels').innerHTML=topics.map(function(t){
    return '<button class="channel-btn'+(t==='all'?' active':'')+'" onclick="switchChannel(\''+t+'\',this)">'+(t==='all'?'All':escHtml(t))+'</button>';
  }).join('');
}

function getChannelList(){
  return['all'].concat(Array.from(new Set(allCards.map(function(c){return c.channel;}))));
}

function switchChannel(topic,el){
  activeChannel=topic;
  document.querySelectorAll('.channel-btn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  renderFeed();
}

function formatRunLabel(runDate,createdAt){
  var today=new Date().toISOString().split('T')[0];
  var yesterday=new Date(Date.now()-86400000).toISOString().split('T')[0];
  var timeStr='';
  if(createdAt){
    var d=new Date(createdAt);
    timeStr=' '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase().replace(' ','');
  }
  if(runDate===today)return'Today '+timeStr;
  if(runDate===yesterday)return'Yesterday '+timeStr;
  var d=new Date(runDate+'T12:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' '+timeStr;
}

// Precompute earliest createdAt per pipeline_run across ALL cards (not per-channel batch)
function buildRunTimestamps(){
  var map={};
  allCards.forEach(function(c){
    var run=c.pipelineRun||'unknown';
    if(!map[run]||c.createdAt&&c.createdAt<map[run])map[run]=c.createdAt||'';
  });
  return map;
}

function buildPageContent(el,channelName){
  var pool=channelName==='all'
    ?allCards.slice()
    :allCards.filter(function(c){return c.channel===channelName;});
  var likedSources=new Set();
  likedUrls.forEach(function(url){
    var c=allCards.find(function(x){return x.url===url;});
    if(c)likedSources.add(c.source);
  });
  pool.forEach(function(c){
    var key=(c.author||'')+'|'+c.source;
    c._pScore=(c.score||0)+(followedJournalists[key]?3:0)+(followedPublications[c.source]?3:0)+(likedSources.has(c.source)?2:0);
  });
  var runTimestamps=buildRunTimestamps();
  // Group by pipeline_run, newest first
  var groups={};
  pool.forEach(function(c){
    var run=c.pipelineRun||'unknown';
    if(!groups[run])groups[run]=[];
    groups[run].push(c);
  });
  var runDates=Object.keys(groups).sort(function(a,b){return b.localeCompare(a);});
  el.innerHTML='';
  if(runDates.length===0){el.innerHTML='<div class="empty-state">No cards yet.</div>';return;}
  runDates.forEach(function(runDate,i){
    var batch=groups[runDate];
    batch.sort(function(a,b){return b._pScore-a._pScore;});
    if(i>0){
      var divider=document.createElement('div');
      divider.className='run-divider';
      divider.innerHTML='<div class="run-divider-line"></div>'+
        '<span class="run-divider-label">'+escHtml(formatRunLabel(runDate,runTimestamps[runDate]||''))+'</span>'+
        '<div class="run-divider-line"></div>';
      el.appendChild(divider);
    }
    batch.forEach(function(c){el.appendChild(createCardEl(c));});
  });
}

function renderFeed(){
  var channels=getChannelList();
  var idx=Math.max(0,channels.indexOf(activeChannel));
  buildPageContent(document.getElementById('pagePrev'),channels[(idx-1+channels.length)%channels.length]);
  buildPageContent(document.getElementById('pageCurrent'),activeChannel);
  buildPageContent(document.getElementById('pageNext'),channels[(idx+1)%channels.length]);
  resetPages();
}

function resetPages(){
  var pagesEl=document.getElementById('feedPages');
  var W=document.getElementById('feedContent').offsetWidth;
  pagesEl.style.transition='none';
  pagesEl.style.transform='translateX('+(-W)+'px)';
}

function buildBylineHtml(c){
  var key=(c.author||'')+'|'+c.source;
  var jFollowed=!!followedJournalists[key];
  var pFollowed=!!followedPublications[c.source];
  var pubPart=pFollowed?'<span style="color:#4CAF50">'+escHtml(c.source)+'</span>':escHtml(c.source);
  if(c.author&&c.author!=='Unknown'){
    var authorPart=jFollowed?'<span style="color:#4CAF50">'+escHtml(c.author)+'</span>':escHtml(c.author);
    return authorPart+' · '+pubPart;
  }
  return pubPart;
}

function createCardEl(c){
  var isLiked=likedUrls.has(c.url);
  var jName=c.author&&c.author!=='Unknown'?c.author:c.source;
  var jInit=jName.split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
  var pInit=c.source.split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();

  var div=document.createElement('div');
  div.className='feed-card';
  div.dataset.url=c.url;
  div.innerHTML=
    '<div class="feed-card-channel">'+escHtml(c.channel)+'</div>'+
    '<div class="feed-card-insight">'+escHtml(c.insight)+'</div>'+
    '<div class="feed-card-meta">'+
      '<div class="feed-card-byline">'+buildBylineHtml(c)+'</div>'+
      '<button class="like-btn'+(isLiked?' liked':'')+'" data-action="like">♡</button>'+
    '</div>'+
    '<div class="feed-card-expanded">'+
      (c.title?'<div class="feed-card-title">'+escHtml(c.title)+'</div>':'')+
      (c.context?'<div class="feed-card-context">'+escHtml(c.context)+'</div>':'')+
      '<div class="entity-btns">'+
        '<button class="journalist-btn" data-action="journalist">'+
          '<div class="journalist-avatar">'+escHtml(jInit)+'</div>'+
          '<div class="journalist-info">'+
            '<div class="journalist-name-text">'+escHtml(c.author&&c.author!=='Unknown'?c.author:c.source)+'</div>'+
            (c.author&&c.author!=='Unknown'?'<div class="journalist-pub-text">'+escHtml(c.source)+'</div>':'')+
          '</div>'+
          '<span class="journalist-arrow">›</span>'+
        '</button>'+
        '<button class="journalist-btn" data-action="publication">'+
          '<div class="journalist-avatar">'+escHtml(pInit)+'</div>'+
          '<div class="journalist-info">'+
            '<div class="journalist-name-text">'+escHtml(c.source)+'</div>'+
          '</div>'+
          '<span class="journalist-arrow">›</span>'+
        '</button>'+
      '</div>'+
      '<a class="read-link" href="'+escHtml(c.url)+'" target="_blank">Read full article →</a>'+
    '</div>';

  attachCardHandlers(div,c);
  return div;
}

function attachCardHandlers(div,c){
  div.addEventListener('click',function(e){
    if(e.target.closest('[data-action="journalist"]')){openJournalist(c);return;}
    if(e.target.closest('[data-action="publication"]')){openPublication(c);return;}
    if(e.target.closest('[data-action="like"]')){toggleLike(div,c);return;}
    if(e.target.closest('.read-link'))return;
    toggleExpand(div);
  });
}

function toggleExpand(div){
  var exp=div.querySelector('.feed-card-expanded');
  if(exp)exp.classList.toggle('open');
}

function toggleLike(div,c){
  var btn=div.querySelector('[data-action="like"]');
  if(likedUrls.has(c.url)){
    likedUrls.delete(c.url);
    savedCards=savedCards.filter(function(s){return s.url!==c.url;});
    if(btn)btn.className='like-btn';
  }else{
    likedUrls.add(c.url);
    if(!savedCards.find(function(s){return s.url===c.url;})){savedCards.push({url:c.url,card:c});}
    if(btn)btn.className='like-btn liked';
  }
}


function openJournalist(c){
  openJournalistPanel(c.author||'Unknown',c.source,c.channel,c.authorBio||'');
}

function openRosterJournalist(name,pub){
  var card=allCards.find(function(c){return c.author===name&&c.source===pub;});
  var channel=(followedJournalists[name+'|'+pub]||{}).channel||'';
  openJournalistPanel(name,pub,channel,card?card.authorBio:'');
}

async function openJournalistPanel(name,pub,channel,bio){
  currentJournalist={name:name,pub:pub,channel:channel};
  var init=name.split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
  document.getElementById('panelAvatar').textContent=init;
  document.getElementById('panelName').textContent=name;
  document.getElementById('panelPub').textContent=pub;
  document.getElementById('panelChannel').textContent=channel;
  document.getElementById('journalistBio').textContent=bio||'';
  var key=name+'|'+pub;
  var following=!!followedJournalists[key];
  document.getElementById('followBtn').textContent=following?'Unfollow':'Follow';
  document.getElementById('followBtn').className='follow-btn'+(following?' following':'');
  panelRelated=allCards.filter(function(a){return a.author===name&&a.source===pub;});
  panelSort='date';
  document.querySelectorAll('#journalistPanel .panel-sort-btn').forEach(function(b,i){b.classList.toggle('active',i===0);});
  renderPanelArticles();
  document.getElementById('journalistPanel').classList.add('open');
  if(sb&&name&&name!=='Unknown'){
    try{
      var res=await sb.from('cards').select('*').eq('author',name).eq('source',pub).order('pub_date',{ascending:false}).limit(50);
      if(!res.error&&res.data&&res.data.length>0){panelRelated=res.data.map(normalizeCard);renderPanelArticles();}
    }catch(ex){}
  }
}

function renderPanelArticles(){
  var sorted=panelRelated.slice();
  if(panelSort==='date'){sorted.sort(function(a,b){return new Date(b.pubDate||0)-new Date(a.pubDate||0);});}
  else{sorted.sort(function(a,b){return a.channel.localeCompare(b.channel);});}
  var feedCards=sorted.filter(function(a){return!a.archiveOnly&&!!a.insight;});
  var archiveItems=sorted.filter(function(a){return a.archiveOnly||!a.insight;});
  if(feedCards.length===0&&archiveItems.length===0){
    document.getElementById('panelArticles').innerHTML='<div class="panel-single-note">No articles from this journalist yet.</div>';
    return;
  }
  var html='';
  feedCards.forEach(function(a){
    var dateStr=a.pubDate?new Date(a.pubDate).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
    html+='<div class="article-item" onclick="window.open(\''+escHtml(a.url)+'\',\'_blank\')">'+
      '<div class="article-item-insight">'+escHtml(a.insight)+'</div>'+
      '<div class="article-item-meta">'+escHtml(a.source)+(dateStr?' · '+dateStr:'')+'</div></div>';
  });
  if(feedCards.length===1){html+='<div class="panel-single-note">Only one article in your feed — more will appear as the pipeline runs.</div>';}
  if(archiveItems.length>0){
    html+='<div class="panel-section" style="margin:20px 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#333;">Also captured</div>';
    archiveItems.forEach(function(a){
      var dateStr=a.pubDate?new Date(a.pubDate).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
      html+='<div class="article-item" onclick="window.open(\''+escHtml(a.url)+'\',\'_blank\')">'+
        '<div class="article-item-insight" style="color:#555;">'+escHtml(a.title)+'</div>'+
        '<div class="article-item-meta">'+escHtml(a.source)+(dateStr?' · '+dateStr:'')+'</div></div>';
    });
  }
  document.getElementById('panelArticles').innerHTML=html;
}

function sortPanelArticles(sort,btn){
  panelSort=sort;
  document.querySelectorAll('#journalistPanel .panel-sort-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');renderPanelArticles();
}

function closeJournalist(){document.getElementById('journalistPanel').classList.remove('open');}

function openPublication(c){openPublicationPanel(c.source);}
function openRosterPublication(name){openPublicationPanel(name);}

async function openPublicationPanel(name){
  currentPublication={name:name};
  var init=name.split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
  document.getElementById('pubPanelAvatar').textContent=init;
  document.getElementById('pubPanelName').textContent=name;
  document.getElementById('publicationBio').textContent='';
  var following=!!followedPublications[name];
  document.getElementById('pubFollowBtn').textContent=following?'Unfollow':'Follow';
  document.getElementById('pubFollowBtn').className='follow-btn'+(following?' following':'');
  pubPanelRelated=allCards.filter(function(c){return c.source===name&&!c.archiveOnly&&!!c.insight;});
  pubPanelSort='date';
  document.getElementById('pubSortDate').classList.add('active');
  document.getElementById('pubSortChannel').classList.remove('active');
  renderPubPanelArticles();
  document.getElementById('publicationPanel').classList.add('open');
  if(sb){
    try{
      var bioRes=await sb.from('publication_bios').select('bio').eq('name',name).maybeSingle();
      if(!bioRes.error&&bioRes.data&&bioRes.data.bio){
        document.getElementById('publicationBio').textContent=bioRes.data.bio;
      }
    }catch(ex){}
    try{
      var artRes=await sb.from('cards').select('*').eq('source',name).order('pub_date',{ascending:false}).limit(100);
      if(!artRes.error&&artRes.data&&artRes.data.length>0){
        pubPanelRelated=artRes.data.map(normalizeCard).filter(function(c){return!c.archiveOnly&&!!c.insight;});
        renderPubPanelArticles();
      }
    }catch(ex){}
  }
}

function renderPubPanelArticles(){
  var sorted=pubPanelRelated.slice();
  if(pubPanelSort==='date'){sorted.sort(function(a,b){return new Date(b.pubDate||0)-new Date(a.pubDate||0);});}
  else{sorted.sort(function(a,b){return a.channel.localeCompare(b.channel);});}
  var el=document.getElementById('pubPanelArticles');
  if(sorted.length===0){el.innerHTML='<div class="panel-single-note">No articles from this publication yet.</div>';return;}
  var html='';
  sorted.forEach(function(a){
    var dateStr=a.pubDate?new Date(a.pubDate).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
    html+='<div class="article-item" onclick="window.open(\''+escHtml(a.url)+'\',\'_blank\')">'+
      '<div class="article-item-insight">'+escHtml(a.insight)+'</div>'+
      '<div class="article-item-meta">'+escHtml(a.channel)+(dateStr?' · '+dateStr:'')+(a.author&&a.author!=='Unknown'?' · '+escHtml(a.author):'')+'</div></div>';
  });
  if(sorted.length===1){html+='<div class="panel-single-note">Only one article from this publication in your feed — check back as more appear.</div>';}
  el.innerHTML=html;
}

function sortPubPanelArticles(sort,btn){
  pubPanelSort=sort;
  document.getElementById('pubSortDate').classList.remove('active');
  document.getElementById('pubSortChannel').classList.remove('active');
  btn.classList.add('active');
  renderPubPanelArticles();
}

function closePublication(){document.getElementById('publicationPanel').classList.remove('open');}

function togglePublicationFollow(){
  if(!currentPublication)return;
  var name=currentPublication.name;
  if(followedPublications[name]){
    delete followedPublications[name];
    if(sb)sb.from('followed_publications').delete().eq('name',name).then(function(){});
    document.getElementById('pubFollowBtn').textContent='Follow';
    document.getElementById('pubFollowBtn').className='follow-btn';
  }else{
    followedPublications[name]=true;
    if(sb)sb.from('followed_publications').upsert({name:name}).then(function(){});
    document.getElementById('pubFollowBtn').textContent='Unfollow';
    document.getElementById('pubFollowBtn').className='follow-btn following';
  }
  updateFeedBylinesForPub(name);
  renderVoices();
}

function toggleFollow(){
  if(!currentJournalist)return;
  var key=currentJournalist.name+'|'+currentJournalist.pub;
  if(followedJournalists[key]){
    delete followedJournalists[key];
    if(sb)sb.from('followed_journalists').delete().eq('name',currentJournalist.name).eq('publication',currentJournalist.pub).then(function(){});
    document.getElementById('followBtn').textContent='Follow';
    document.getElementById('followBtn').className='follow-btn';
  }else{
    followedJournalists[key]=currentJournalist;
    if(sb)sb.from('followed_journalists').upsert({name:currentJournalist.name,publication:currentJournalist.pub}).then(function(){});
    document.getElementById('followBtn').textContent='Unfollow';
    document.getElementById('followBtn').className='follow-btn following';
  }
  updateFeedBylines(currentJournalist.name,currentJournalist.pub);
  renderVoices();
}

function updateFeedBylines(authorName,pub){
  document.querySelectorAll('.feed-card').forEach(function(div){
    var c=allCards.find(function(x){return x.url===div.dataset.url;});
    if(!c||c.author!==authorName||c.source!==pub)return;
    var el=div.querySelector('.feed-card-byline');
    if(el)el.innerHTML=buildBylineHtml(c);
  });
}

function updateFeedBylinesForPub(pubName){
  document.querySelectorAll('.feed-card').forEach(function(div){
    var c=allCards.find(function(x){return x.url===div.dataset.url;});
    if(!c||c.source!==pubName)return;
    var el=div.querySelector('.feed-card-byline');
    if(el)el.innerHTML=buildBylineHtml(c);
  });
}

function switchView(view,btn){
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('feedView').style.display=view==='feed'?'flex':'none';
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  if(view!=='feed')document.getElementById(view+'View').classList.add('active');
  if(view==='deck')renderDeck();
  if(view==='voices')renderVoices();
  if(view==='archive')renderArchive();
}

function renderDeck(){
  var el=document.getElementById('deckContent');
  if(savedCards.length===0){
    el.innerHTML='<div class="empty-state">No liked cards yet.<br>Tap 👍 on any card to save it here.</div>';
    return;
  }
  el.innerHTML=savedCards.map(function(s,i){
    return '<div class="deck-card">'+
      '<div class="deck-card-header">'+
        '<div class="deck-card-channel">'+escHtml(s.card.channel)+'</div>'+
        '<button class="deck-remove" onclick="removeFromDeck('+i+')">×</button>'+
      '</div>'+
      '<div class="deck-card-insight">'+escHtml(s.card.insight)+'</div>'+
      '<div class="deck-card-meta">'+
        '<span>'+escHtml(s.card.source)+(s.card.author&&s.card.author!=='Unknown'?' — '+escHtml(s.card.author):'')+'</span>'+
        '<a href="'+escHtml(s.card.url)+'" target="_blank" style="color:#4a9eff;font-size:12px;text-decoration:none;">Read →</a>'+
      '</div></div>';
  }).join('');
}

function removeFromDeck(i){
  var url=savedCards[i].url;
  savedCards.splice(i,1);
  likedUrls.delete(url);
  document.querySelectorAll('.feed-card').forEach(function(div){
    if(div.dataset.url===url){
      var btn=div.querySelector('[data-action="like"]');
      if(btn)btn.className='like-btn';
    }
  });
  renderDeck();
}

function renderVoices(){
  var el=document.getElementById('rosterContent');
  var js=Object.values(followedJournalists).sort(function(a,b){return a.name.localeCompare(b.name);});
  var pubs=Object.keys(followedPublications).sort();
  var html='';
  html+='<div class="voices-section-header">Journalists</div>';
  if(js.length===0){
    html+='<div style="color:#333;font-size:13px;padding:12px 0 4px;">No followed journalists yet.</div>';
  }else{
    html+='<div class="roster-section">'+js.map(journalistRosterItem).join('')+'</div>';
  }
  html+='<div class="voices-section-header">Publications</div>';
  if(pubs.length===0){
    html+='<div style="color:#333;font-size:13px;padding:12px 0 4px;">No followed publications yet.</div>';
  }else{
    html+='<div class="roster-section">'+pubs.map(pubRosterItem).join('')+'</div>';
  }
  el.innerHTML=html;
}

function journalistRosterItem(j){
  var init=j.name.split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
  return '<div class="roster-item" data-name="'+escHtml(j.name)+'" data-pub="'+escHtml(j.pub)+'">'+
    '<div class="roster-avatar">'+escHtml(init)+'</div>'+
    '<div class="roster-info">'+
      '<div class="roster-name">'+escHtml(j.name)+'</div>'+
      '<div class="roster-pub">'+escHtml(j.pub)+'</div>'+
    '</div>'+
    '<span style="color:#333;font-size:16px;padding-left:8px;">›</span>'+
  '</div>';
}

function pubRosterItem(name){
  var init=name.split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
  return '<div class="roster-item" data-pub-name="'+escHtml(name)+'">'+
    '<div class="roster-avatar">'+escHtml(init)+'</div>'+
    '<div class="roster-info">'+
      '<div class="roster-name">'+escHtml(name)+'</div>'+
    '</div>'+
    '<span style="color:#333;font-size:16px;padding-left:8px;">›</span>'+
  '</div>';
}

function renderArchive(){
  document.getElementById('archiveContent').innerHTML='<div class="empty-state">Your archive will appear here.<br>Liked cards move here at the end of each day.</div>';
}

function navigateChannel(dir){
  var channels=getChannelList();
  var idx=Math.max(0,channels.indexOf(activeChannel));
  var nextIdx=(idx+dir+channels.length)%channels.length;
  activeChannel=channels[nextIdx];
  document.querySelectorAll('.channel-btn').forEach(function(b){b.classList.remove('active');});
  var btns=document.querySelectorAll('.channel-btn');
  if(btns[nextIdx]){
    btns[nextIdx].classList.add('active');
    btns[nextIdx].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  }
  renderFeed();
}

(function(){
  var startX=0,startY=0,startTime=0,lock=null,animating=false;
  var content=document.getElementById('feedContent');
  var pages=document.getElementById('feedPages');

  function settle(x,anim){
    pages.style.transition=anim?'transform 0.32s cubic-bezier(0.25,0.46,0.45,0.94)':'none';
    pages.style.transform='translateX('+x+'px)';
  }

  content.addEventListener('touchstart',function(e){
    if(animating)return;
    startX=e.touches[0].clientX;startY=e.touches[0].clientY;
    startTime=Date.now();lock=null;
    pages.style.transition='none';
  },{passive:true});

  content.addEventListener('touchmove',function(e){
    if(animating)return;
    var dx=e.touches[0].clientX-startX;
    var dy=e.touches[0].clientY-startY;
    if(!lock&&(Math.abs(dx)>8||Math.abs(dy)>8)){lock=Math.abs(dx)>Math.abs(dy)?'h':'v';}
    if(lock!=='h')return;
    e.preventDefault();
    var W=content.offsetWidth;
    settle(-W+dx,false);
  },{passive:false});

  content.addEventListener('touchend',function(e){
    if(animating||lock!=='h')return;
    var dx=e.changedTouches[0].clientX-startX;
    var velocity=dx/(Date.now()-startTime);
    var W=content.offsetWidth;
    var isFlick=Math.abs(velocity)>0.3;
    if(dx<-(W*0.3)||(dx<-20&&isFlick)){
      animating=true;settle(-W*2,true);
      setTimeout(function(){animating=false;navigateChannel(1);},320);
    }else if(dx>(W*0.3)||(dx>20&&isFlick)){
      animating=true;settle(0,true);
      setTimeout(function(){animating=false;navigateChannel(-1);},320);
    }else{
      settle(-W,true);
    }
  },{passive:true});
})();

var timerLoading=false;
function getNextRunMs(){
  var etDate=new Date(Date.now()-(4*3600*1000));
  var cur=etDate.getUTCHours()*3600+etDate.getUTCMinutes()*60+etDate.getUTCSeconds();
  var next=[6*3600,16*3600].find(function(t){return t>cur;});
  return((next!==undefined?next:30*3600)-cur)*1000;
}
function updateTimer(){
  if(timerLoading)return;
  var el=document.getElementById('refreshTimer');
  if(!el)return;
  var ms=getNextRunMs();
  if(ms<5000){
    timerLoading=true;
    el.textContent='Refreshing...';
    loadCards().then(function(){timerLoading=false;},function(){timerLoading=false;});
    return;
  }
  var sec=Math.floor(ms/1000);
  var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  el.textContent='Next refresh in '+(h>0?h+'h '+m+'m':m>0?m+'m '+s+'s':s+'s');
}
setInterval(updateTimer,1000);
updateTimer();

document.getElementById('rosterContent').addEventListener('click',function(e){
  var jItem=e.target.closest('.roster-item[data-name]');
  if(jItem){openRosterJournalist(jItem.dataset.name,jItem.dataset.pub);return;}
  var pItem=e.target.closest('.roster-item[data-pub-name]');
  if(pItem){openRosterPublication(pItem.dataset.pubName);}
});

loadCards();
</script>
