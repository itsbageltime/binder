<html lang="en">
<head>
<meta charset="UTF-8">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: #0a0a0a; color: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
header { padding: 16px 20px 8px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
header .date { font-size: 12px; color: #555; }
.header-user { width: 28px; height: 28px; border-radius: 50%; background: #1e1e1e; border: 1px solid #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #888; cursor: pointer; flex-shrink: 0; }

.signout-popover button { display: block; width: 100%; padding: 8px 14px; background: none; border: none; color: #888; font-size: 13px; cursor: pointer; text-align: left; border-radius: 6px; white-space: nowrap; }
.signout-popover button:hover { background: #222; color: #ccc; }
.nav { display: flex; border-bottom: 1px solid #1a1a1a; flex-shrink: 0; }
.nav-btn { flex: 1; padding: 10px; background: none; border: none; color: #444; font-size: 12px; font-weight: 500; cursor: pointer; transition: color 0.2s; border-bottom: 2px solid transparent; }
.nav-btn.active { color: #f0f0f0; border-bottom-color: #f0f0f0; }
.content { flex: 1; overflow: hidden; position: relative; }
.feed-view { position: absolute; inset: 0; display: flex; flex-direction: column; }

@keyframes slideFromRight { from { opacity:0; transform:translateX(28px); } to { opacity:1; transform:translateX(0); } }
@keyframes slideFromLeft  { from { opacity:0; transform:translateX(-28px); } to { opacity:1; transform:translateX(0); } }
.feed-page.slide-from-right { animation: slideFromRight 0.22s ease-out; }
.feed-page.slide-from-left  { animation: slideFromLeft  0.22s ease-out; }

.run-divider-line { flex: 1; height: 1px; background: #1a1a1a; }
.run-divider-label { font-size: 11px; color: #444; white-space: nowrap; flex-shrink: 0; }

.feed-card-channel { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #333; margin-bottom: 10px; }
.feed-card-insight { font-size: 17px; font-weight: 500; line-height: 1.5; color: #f0f0f0; margin-bottom: 12px; }

.feed-card-byline { font-size: 12px; color: #444; }

.journalist-info { flex: 1; }
.journalist-name-text { font-size: 13px; font-weight: 500; color: #ccc; }
.journalist-arrow { color: #333; font-size: 14px; }
.read-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #4a9eff; text-decoration: none; border: 1px solid #1a3a5c; padding: 7px 14px; border-radius: 10px; }
.like-btn { background: transparent; border: none; padding: 6px 4px 6px 12px; font-size: 16px; cursor: pointer; color: #444; transition: color 0.15s; line-height: 1; }
.like-btn.liked { color: #4CAF50; }
.view { position: absolute; inset: 0; overflow-y: auto; padding: 16px 20px; display: none; }
.view.active { display: block; }
.deck-card { background: #141414; border: 1px solid #222; border-radius: 16px; padding: 18px; margin-bottom: 10px; }
.deck-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.deck-card-channel { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #444; }
.deck-remove { background: none; border: none; color: #333; font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
.deck-remove:hover { color: #888; }
.deck-card-insight { font-size: 16px; font-weight: 500; color: #f0f0f0; line-height: 1.4; margin-bottom: 10px; }
.deck-card-meta { font-size: 12px; color: #444; display: flex; justify-content: space-between; align-items: center; }
.roster-view-toggle { display: flex; gap: 6px; margin-bottom: 16px; }
.roster-toggle-btn { padding: 5px 12px; border-radius: 20px; border: 1px solid #2a2a2a; background: transparent; color: #555; font-size: 12px; cursor: pointer; transition: all 0.2s; }
.roster-toggle-btn.active { background: #1e1e1e; color: #f0f0f0; border-color: #444; }
.roster-section { margin-bottom: 24px; }
.roster-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #333; margin-bottom: 10px; }
.roster-item { display: flex; align-items: center; gap: 12px; background: #141414; border: 1px solid #1e1e1e; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }

.journalist-panel { position: absolute; inset: 0; background: #0a0a0a; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); z-index: 10; overflow-y: auto; }

.panel-inner { max-width: 560px; margin: 0 auto; padding: 24px 20px; }
.panel-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }

.profile-info { flex: 1; min-width: 0; }
.profile-name { font-size: 17px; font-weight: 600; color: #f0f0f0; }

.panel-articles-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.panel-section { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #333; }
.panel-sort { display: flex; gap: 6px; }
.panel-sort-btn { padding: 4px 10px; border-radius: 20px; border: 1px solid #2a2a2a; background: transparent; color: #555; font-size: 11px; cursor: pointer; }
.panel-sort-btn.active { background: #1e1e1e; color: #f0f0f0; border-color: #444; }
.article-item { background: #141414; border: 1px solid #1e1e1e; border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; }

.article-item-meta { font-size: 11px; color: #444; margin-top: 6px; }

.feed-survey-btns { display: flex; gap: 8px; justify-content: center; }
.feed-survey-btn { padding: 8px 18px; border-radius: 20px; border: 1px solid #2a2a2a; background: transparent; color: #666; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.feed-survey-btn:hover { border-color: #444; color: #ccc; }
.feed-survey-btn.selected { background: #1e1e1e; color: #f0f0f0; border-color: #444; }
/* Auth overlay */

.auth-logo { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
.auth-tagline { font-size: 13px; color: #444; margin-bottom: 40px; }

.auth-input { width: 100%; padding: 13px 16px; background: #111; border: 1px solid #222; border-radius: 12px; color: #f0f0f0; font-size: 15px; margin-bottom: 10px; outline: none; -webkit-appearance: none; }
.auth-input:focus { border-color: #333; }
.auth-btn-primary { width: 100%; padding: 14px; background: #f0f0f0; color: #0a0a0a; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; transition: opacity 0.15s; }
.auth-btn-primary:active { opacity: 0.85; }
.auth-btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.auth-toggle { margin-top: 20px; font-size: 13px; color: #444; text-align: center; }
.auth-toggle span { color: #888; cursor: pointer; text-decoration: underline; }
.auth-error { font-size: 12px; color: #e05a5a; margin-top: 8px; min-height: 18px; text-align: center; }
/* Channel select overlay */
.channel-select-overlay { position: fixed; inset: 0; background: #0a0a0a; z-index: 200; display: none; flex-direction: column; }
.channel-select-overlay.open { display: flex; }
.channel-select-header { padding: 40px 20px 20px; flex-shrink: 0; }
.channel-select-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.channel-select-sub { font-size: 13px; color: #555; }
.channel-select-count { font-size: 12px; color: #4CAF50; margin-top: 4px; min-height: 18px; }
.channel-select-body { flex: 1; overflow-y: auto; padding: 0 20px 20px; }
.channel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
.channel-tile { background: #111; border: 1.5px solid #1e1e1e; border-radius: 14px; padding: 14px 14px 12px; cursor: pointer; transition: border-color 0.15s; text-align: left; }
.channel-tile.selected { border-color: #4CAF50; }
.channel-tile-name { font-size: 14px; font-weight: 600; color: #ccc; margin-bottom: 4px; }

  <div class="auth-logo">Binder</div>
  <div class="auth-tagline">Signal, not noise.</div>
  <div class="auth-form">
    <input class="auth-input" id="authEmail" type="email" placeholder="Email" autocomplete="email">
    <input class="auth-input" id="authPassword" type="password" placeholder="Password" autocomplete="current-password">
    <div class="auth-error" id="authError"></div>
    <button class="auth-btn-primary" id="authPrimaryBtn" onclick="handleAuthSubmit()">Create account</button>
    <div class="auth-toggle" id="authToggle">Already have an account? <span onclick="toggleAuthMode()">Sign in</span></div>
  </div>
</div>

<!-- Channel select overlay -->
<div class="channel-select-overlay" id="channelSelectOverlay">
  <div class="channel-select-header">
    <button class="panel-back" id="channelSelectBack" style="display:none;margin-bottom:16px;" onclick="closeChannelSettings()">← Back</button>
    <div class="channel-select-title" id="channelSelectTitle">What interests you?</div>
    <div class="channel-select-sub" id="channelSelectSub">Select at least 3 channels to get started.</div>
    <div class="channel-select-count" id="channelSelectCount"></div>
  </div>
  <div class="channel-select-body">
    <div class="channel-grid" id="channelGrid"></div>
    <div class="channel-custom">
      <div class="channel-custom-label">Add your own</div>
      <div class="channel-custom-row">
        <input class="channel-custom-input" id="customChannelInput" type="text" placeholder="e.g. Artificial Intelligence">
        <button class="channel-custom-add" onclick="addCustomChannel()">Add</button>
      </div>
      <div class="channel-chips" id="customChannelChips"></div>
    </div>
  </div>
  <div class="channel-select-footer">
    <button class="channel-start-btn" id="channelStartBtn" disabled onclick="saveChannels()">Start reading</button>
  </div>
</div>

<header>

  <span class="date" id="dateLabel"></span>
  <div class="header-user" id="headerUser" onclick="toggleUserPopover()"></div>

    <button onclick="showSettingsChannels()">Channels</button>
    <button onclick="handleSignOut()">Sign out</button>
  </div>
</header>
<div class="nav">

  <button class="nav-btn" onclick="switchView('deck',this)">Deck</button>

  <button class="nav-btn" onclick="switchView('archive',this)">Archive</button>
</div>
<div class="content">

    <div class="channels" id="channels"></div>
    <div class="refresh-timer" id="refreshTimer"></div>
    <div class="feed-content" id="feedContent">
      <div class="feed-page" id="pageCurrent"></div>
    </div>
  </div>
  <div class="view" id="deckView"><div id="deckContent"></div></div>
  <div class="view" id="voicesView"><div id="rosterContent"></div></div>

          <div class="profile-pub" id="panelPub"></div>
          <div class="profile-channel" id="panelChannel"></div>

        <button class="follow-btn" id="followBtn" onclick="toggleFollow()">Follow</button>

      <div class="journalist-bio" id="journalistBio"></div>
      <div class="panel-articles-header">
        <div class="panel-sort">
          <button class="panel-sort-btn active" onclick="sortPanelArticles('date',this)">Recent</button>
          <button class="panel-sort-btn" onclick="sortPanelArticles('channel',this)">Channel</button>
        </div>
        <span class="panel-section">In your feed</span>
      </div>
      <div id="panelArticles"></div>
    </div>
  </div>
  <div class="journalist-panel" id="publicationPanel">
    <div class="panel-inner">
      <div class="panel-header"><button class="panel-back" onclick="closePublication()">← Back</button></div>

        <div class="profile-avatar" id="pubPanelAvatar"></div>
        <div class="profile-info"><div class="profile-name" id="pubPanelName"></div></div>
        <button class="follow-btn" id="pubFollowBtn" onclick="togglePublicationFollow()">Follow</button>
      </div>
      <div class="journalist-bio" id="publicationBio"></div>
      <div class="panel-articles-header">
        <div class="panel-sort">
          <button class="panel-sort-btn active" id="pubSortDate" onclick="sortPubPanelArticles('date',this)">Recent</button>

        </div>
        <span class="panel-section">In your feed</span>
      </div>
      <div id="pubPanelArticles"></div>
    </div>
  </div>
</div>

function normalizeCard(c){
  return{
    channel:c.channel||'',insight:c.insight||'',context:c.context||'',
    score:c.score||0,title:c.title||'',source:c.source||'',author:c.author||'',
    authorBio:c.author_bio||c.authorBio||'',pubDate:c.pub_date||c.pubDate||'',
    url:c.url||'',archiveOnly:c.archive_only||false,
    pipelineRun:c.pipeline_run||'',createdAt:c.created_at||''
  };
}

// ─── Auth ───────────────────────────────────────────────────────────────────────
function initAuth(){
  if(!sb){showApp(null);return;}
  sb.auth.onAuthStateChange(function(event,session){
    if(session&&session.user){
      currentUser=session.user;
      document.getElementById('authOverlay').style.display='none';
      loadProfile().then(function(){
        if(!userProfile||!userProfile.channels||!userProfile.channels.length){
          showChannelSelectScreen();
        }else{
          startApp();
        }
      });
    }else{
      currentUser=null;
      userProfile=null;
      document.getElementById('authOverlay').style.display='flex';
    }
  });
  sb.auth.getSession();
}

function toggleAuthMode(){
  authMode=authMode==='signup'?'login':'signup';
  document.getElementById('authPrimaryBtn').textContent=authMode==='signup'?'Create account':'Sign in';
  document.getElementById('authToggle').innerHTML=authMode==='signup'
    ?'Already have an account? <span onclick="toggleAuthMode()">Sign in</span>'
    :'New to Binder? <span onclick="toggleAuthMode()">Create account</span>';
  document.getElementById('authError').textContent='';
}

async function handleAuthSubmit(){
  var email=document.getElementById('authEmail').value.trim();
  var pass=document.getElementById('authPassword').value;
  var errEl=document.getElementById('authError');
  var btn=document.getElementById('authPrimaryBtn');
  if(!email||!pass){errEl.textContent='Email and password required.';return;}
  btn.disabled=true;errEl.textContent='';
  try{
    if(authMode==='signup'){
      var res=await sb.auth.signUp({email:email,password:pass});
      if(res.error)throw res.error;
      // Profile created by trigger or we create it here
      if(res.data&&res.data.user){
        await sb.from('profiles').upsert({user_id:res.data.user.id,email:email,channels:[]});
      }
    }else{
      var res=await sb.auth.signInWithPassword({email:email,password:pass});
      if(res.error)throw res.error;
    }
  }catch(e){
    errEl.textContent=e.message||'Something went wrong.';
    btn.disabled=false;
  }
}

async function handleSignOut(){
  document.getElementById('signoutPopover').classList.remove('open');
  if(sb)await sb.auth.signOut();
  // Reset state
  allCards=[];likedUrls=new Set();savedCards=[];
  followedJournalists={};followedPublications={};
  userSignalData={clickedSources:new Set(),dwelledSources:new Set(),likedChannels:new Map(),scrolledPastSources:new Map()};
  signalCount=0;signalBuffer=[];sessionData={cards_seen:0,cards_completed:0,expands:0,article_clicks:0,likes:0};
  seenCardUrls=new Set();surveyAnsweredToday=false;currentUser=null;userProfile=null;
  document.getElementById('authOverlay').style.display='flex';
  authMode='signup';
  document.getElementById('authPrimaryBtn').textContent='Create account';
  document.getElementById('authToggle').innerHTML='Already have an account? <span onclick="toggleAuthMode()">Sign in</span>';
  document.getElementById('authError').textContent='';
  document.getElementById('authEmail').value='';document.getElementById('authPassword').value='';
}

function toggleUserPopover(){
  document.getElementById('signoutPopover').classList.toggle('open');
}
document.addEventListener('click',function(e){
  if(!e.target.closest('#headerUser')&&!e.target.closest('#signoutPopover')){
    document.getElementById('signoutPopover').classList.remove('open');
  }
});

async function loadProfile(){
  if(!sb||!currentUser)return;
  try{
    var res=await sb.from('profiles').select('*').eq('user_id',currentUser.id).maybeSingle();
    if(!res.error&&res.data)userProfile=res.data;
  }catch(e){}
}

async function startApp(){
  var init=currentUser&&currentUser.email?(currentUser.email[0]||'?').toUpperCase():'?';
  document.getElementById('headerUser').textContent=init;
  await Promise.all([loadFollows(),loadUserSignals()]);
  await loadCards();
  await loadUserLikes();
  checkSurveyAnswered();
}

// ─── Channel selection screen ──────────────────────────────────────────────────
var channelSelectMode='signup'; // 'signup' | 'settings'

function showChannelSelectScreen(mode){
  channelSelectMode=mode||'signup';
  selectedChannelTiles=new Set();customChannels=[];

  // In settings mode, pre-populate from current profile
  var standardNames=CHANNEL_DEFS.map(function(c){return c.name;});
  if(channelSelectMode==='settings'&&userProfile&&userProfile.channels){
    userProfile.channels.forEach(function(ch){
      if(standardNames.indexOf(ch)!==-1)selectedChannelTiles.add(ch);
      else customChannels.push(ch);
    });
  }

  var grid=document.getElementById('channelGrid');
  grid.innerHTML=CHANNEL_DEFS.map(function(ch){
    var sel=selectedChannelTiles.has(ch.name);
    return '<div class="channel-tile'+(sel?' selected':'')+'" data-channel="'+escHtml(ch.name)+'" onclick="toggleChannelTile(this,\''+escHtml(ch.name)+'\')">'+
      '<div class="channel-tile-name">'+escHtml(ch.name)+'</div>'+
      '<div class="channel-tile-desc">'+escHtml(ch.desc)+'</div>'+
    '</div>';
  }).join('');

  renderCustomChips();
  document.getElementById('customChannelInput').value='';

  var isSettings=channelSelectMode==='settings';
  document.getElementById('channelSelectTitle').textContent=isSettings?'Your channels':'What interests you?';
  document.getElementById('channelSelectSub').textContent=isSettings?'Add or remove channels. Minimum 3.':'Select at least 3 channels to get started.';
  document.getElementById('channelStartBtn').textContent=isSettings?'Save changes':'Start reading';
  document.getElementById('channelSelectBack').style.display=isSettings?'block':'none';

  updateChannelSelectCount();
  document.getElementById('channelSelectOverlay').classList.add('open');
  if(!isSettings)document.getElementById('authOverlay').style.display='none';
}

function showSettingsChannels(){
  document.getElementById('signoutPopover').classList.remove('open');
  showChannelSelectScreen('settings');
}

function closeChannelSettings(){
  document.getElementById('channelSelectOverlay').classList.remove('open');
}

function toggleChannelTile(el,name){
  if(selectedChannelTiles.has(name)){selectedChannelTiles.delete(name);el.classList.remove('selected');}
  else{selectedChannelTiles.add(name);el.classList.add('selected');}
  updateChannelSelectCount();
}

function addCustomChannel(){
  var input=document.getElementById('customChannelInput');
  var val=input.value.trim();
  if(!val)return;
  if(customChannels.indexOf(val)===-1){customChannels.push(val);renderCustomChips();}
  input.value='';
  updateChannelSelectCount();
}
document.getElementById('customChannelInput').addEventListener('keydown',function(e){if(e.key==='Enter')addCustomChannel();});

function removeCustomChannel(name){
  customChannels=customChannels.filter(function(c){return c!==name;});
  renderCustomChips();updateChannelSelectCount();
}

function renderCustomChips(){
  document.getElementById('customChannelChips').innerHTML=customChannels.map(function(name){
    return '<div class="channel-chip">'+escHtml(name)+'<button class="channel-chip-remove" onclick="removeCustomChannel(\''+escHtml(name)+'\')">×</button></div>';
  }).join('');
}

function updateChannelSelectCount(){
  var total=selectedChannelTiles.size+customChannels.length;
  var btn=document.getElementById('channelStartBtn');
  var countEl=document.getElementById('channelSelectCount');
  btn.disabled=total<3;
  countEl.textContent=total>0?total+' selected'+(total<3?' — need at least 3':''):'';
}

async function saveChannels(){
  var channels=Array.from(selectedChannelTiles).concat(customChannels);
  if(channels.length<3)return;
  var btn=document.getElementById('channelStartBtn');
  btn.disabled=true;btn.textContent='Saving...';
  if(sb&&currentUser){
    await sb.from('profiles').upsert({user_id:currentUser.id,email:currentUser.email,channels:channels});
  }
  userProfile=userProfile||{};userProfile.channels=channels;
  document.getElementById('channelSelectOverlay').classList.remove('open');
  btn.textContent=channelSelectMode==='settings'?'Save changes':'Start reading';
  if(channelSelectMode==='settings'){
    // Rebuild channel tabs and feed with updated selection
    buildChannels();
    activeChannel='all';
    document.querySelectorAll('.channel-btn').forEach(function(b){b.classList.remove('active');});
    var first=document.querySelector('.channel-btn');
    if(first)first.classList.add('active');
    renderFeed();
  }else{
    startApp();
  }
}

// ─── Data loading ───────────────────────────────────────────────────────────────
function getUserChannels(){
  if(userProfile&&userProfile.channels&&userProfile.channels.length>0)return userProfile.channels;
  return CHANNEL_DEFS.map(function(c){return c.name;});
}

async function loadFollows(){
  if(!sb||!currentUser)return;
  try{
    var uid=currentUser.id;
    var results=await Promise.all([
      sb.from('followed_journalists').select('name,publication').eq('user_id',uid),
      sb.from('followed_publications').select('name').eq('user_id',uid)
    ]);
    var jRes=results[0],pRes=results[1];
    if(!jRes.error&&jRes.data){
      jRes.data.forEach(function(j){
        var key=j.name+'|'+j.publication;
        if(!followedJournalists[key])followedJournalists[key]={name:j.name,pub:j.publication,channel:''};
      });
    }
    if(!pRes.error&&pRes.data){
      pRes.data.forEach(function(p){followedPublications[p.name]=true;});
    }
  }catch(e){}
}

async function loadUserSignals(){
  if(!sb||!currentUser)return;
  try{
    var res=await sb.from('user_signals').select('signal_type,source,channel,dwell_seconds').eq('user_id',currentUser.id);
    if(res.error||!res.data)return;
    signalCount=res.data.length;
    res.data.forEach(function(s){
      if(s.signal_type==='click_through'&&s.source)userSignalData.clickedSources.add(s.source);
      if(s.signal_type==='dwell'&&s.source&&s.dwell_seconds>=10)userSignalData.dwelledSources.add(s.source);
      if(s.signal_type==='like'&&s.channel){
        userSignalData.likedChannels.set(s.channel,(userSignalData.likedChannels.get(s.channel)||0)+1);
      }
      if(s.signal_type==='scroll_past'&&s.source){
        userSignalData.scrolledPastSources.set(s.source,(userSignalData.scrolledPastSources.get(s.source)||0)+1);
      }
    });
  }catch(e){}
}

async function loadUserLikes(){
  if(!sb||!currentUser)return;
  try{
    var res=await sb.from('user_likes').select('card_url').eq('user_id',currentUser.id);
    if(res.error||!res.data)return;
    res.data.forEach(function(r){
      likedUrls.add(r.card_url);
      var c=allCards.find(function(x){return x.url===r.card_url;});
      if(c&&!savedCards.find(function(s){return s.url===r.card_url;}))savedCards.push({url:r.card_url,card:c});
    });
    // Refresh like buttons already rendered
    document.querySelectorAll('.feed-card').forEach(function(div){
      var btn=div.querySelector('[data-action="like"]');
      if(btn)btn.className='like-btn'+(likedUrls.has(div.dataset.url)?' liked':'');
    });
  }catch(e){}
}

async function loadCards(){
  document.getElementById('pageCurrent').innerHTML='<div class="empty-state" style="color:#222">Loading...</div>';
  if(sb){
    try{
      var sevenDaysAgo=new Date(Date.now()-7*24*3600*1000).toISOString().split('T')[0];
      var res=await sb.from('cards').select('*').gte('pipeline_run',sevenDaysAgo).order('pipeline_run',{ascending:false}).order('score',{ascending:false}).range(0,2999);
      if(!res.error&&res.data&&res.data.length>0){
        allCards=res.data.map(normalizeCard).filter(function(c){return!!c.insight;});
        buildChannels();renderFeed();return;
      }
    }catch(e){console.error('[Binder] Supabase exception:',e);}
  }
  try{
    var r=await fetch('cards.json');
    allCards=(await r.json()).map(normalizeCard).filter(function(c){return!!c.insight;});
    buildChannels();renderFeed();
  }catch(e){
    document.getElementById('pageCurrent').innerHTML='<div class="empty-state">Run node binder.js first.</div>';
  }
}

// ─── Signal recording ───────────────────────────────────────────────────────────
function recordSignal(type,card,extra){
  if(!sb||!currentUser)return;
  var sig={
    user_id:currentUser.id,card_url:card.url,signal_type:type,
    channel:card.channel,source:card.source,author:card.author||null,
    dwell_seconds:(extra&&extra.dwell_seconds)||null
  };
  signalCount++;
  if(type==='scroll_past'){
    signalBuffer.push(sig);
  }else{
    sb.from('user_signals').insert(sig).then(function(){});
    // Update local signal data for immediate scoring effect
    if(type==='click_through')userSignalData.clickedSources.add(card.source);
    if(type==='dwell'&&extra&&extra.dwell_seconds>=10)userSignalData.dwelledSources.add(card.source);
    if(type==='like'){userSignalData.likedChannels.set(card.channel,(userSignalData.likedChannels.get(card.channel)||0)+1);}
  }
}

function flushSignalBuffer(){
  if(!sb||!currentUser||signalBuffer.length===0)return;
  var toFlush=signalBuffer.splice(0);
  toFlush.forEach(function(s){
    userSignalData.scrolledPastSources.set(s.source,(userSignalData.scrolledPastSources.get(s.source)||0)+1);
  });
  sb.from('user_signals').insert(toFlush).then(function(){});
}

function flushSession(){
  if(!sb||!currentUser)return;
  var today=new Date().toISOString().split('T')[0];
  sb.from('user_sessions').upsert(
    {user_id:currentUser.id,date:today,cards_seen:sessionData.cards_seen,cards_completed:sessionData.cards_completed,expands:sessionData.expands,article_clicks:sessionData.article_clicks,likes:sessionData.likes},
    {onConflict:'user_id,date'}
  ).then(function(){});
}

setInterval(flushSignalBuffer,30000);
setInterval(flushSession,60000);
document.addEventListener('visibilitychange',function(){if(document.hidden){flushSignalBuffer();flushSession();}});

// ─── Intersection observer (scroll_past + cards_seen) ──────────────────────────
var cardObserver=new IntersectionObserver(function(entries){
  entries.forEach(function(entry){
    var div=entry.target;
    var url=div.dataset.url;
    if(!url)return;
    var c=allCards.find(function(x){return x.url===url;});
    if(!c)return;
    if(entry.isIntersecting&&entry.intersectionRatio>=0.5){
      if(!seenCardUrls.has(url)){seenCardUrls.add(url);sessionData.cards_seen++;}
    }else if(!entry.isIntersecting&&seenCardUrls.has(url)){
      var exp=div.querySelector('.feed-card-expanded');
      if(!exp||!exp.classList.contains('open')){
        recordSignal('scroll_past',c,{});
        sessionData.cards_completed++;
      }
    }
  });
},{threshold:[0.5]});

// ─── Channels / scoring ─────────────────────────────────────────────────────────
function buildChannels(){
  var userChans=getUserChannels();
  var cardChans=Array.from(new Set(allCards.map(function(c){return c.channel;})));
  // Show user's selected channels that appear in cards, plus any card channels not in user list
  var combined=['all'].concat(cardChans.filter(function(ch){return userChans.indexOf(ch)!==-1;}));
  // Also add user's custom channels (may be empty)
  userChans.forEach(function(ch){if(combined.indexOf(ch)===-1)combined.push(ch);});
  document.getElementById('channels').innerHTML=combined.map(function(t){
    return '<button class="channel-btn'+(t===activeChannel?' active':'')+'" onclick="switchChannel(\''+escHtml(t)+'\',this)">'+(t==='all'?'All':escHtml(t))+'</button>';
  }).join('');
}

function getChannelList(){
  var btns=document.querySelectorAll('.channel-btn');
  return Array.from(btns).map(function(b){return b.textContent==='All'?'all':b.textContent;});
}

function switchChannel(topic,el){
  activeChannel=topic;
  document.querySelectorAll('.channel-btn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  renderFeed();
}

function personalScore(c){
  if(signalCount<20)return c.score||0;
  var key=(c.author||'')+'|'+c.source;
  var score=c.score||0;
  score+=(followedJournalists[key]?3:0);
  score+=(followedPublications[c.source]?3:0);
  score+=(userSignalData.clickedSources.has(c.source)?2:0);
  score+=(userSignalData.dwelledSources.has(c.source)?2:0);
  score+=((userSignalData.likedChannels.get(c.channel)||0)>0?1:0);
  score+=((userSignalData.scrolledPastSources.get(c.source)||0)>=3?-1:0);
  return score;
}

function formatRunLabel(runDate,createdAt){
  var today=new Date().toISOString().split('T')[0];
  var yesterday=new Date(Date.now()-86400000).toISOString().split('T')[0];
  var timeStr='';
  if(createdAt){
    var d=new Date(createdAt);
    timeStr=' '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase().replace(' ','');
  }
  if(runDate===today)return'Today'+timeStr;
  if(runDate===yesterday)return'Yesterday'+timeStr;
  var d=new Date(runDate+'T12:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+timeStr;
}

function buildRunTimestamps(){
  var map={};
  allCards.forEach(function(c){
    var run=c.pipelineRun||'unknown';
    if(!map[run]||c.createdAt&&c.createdAt<map[run])map[run]=c.createdAt||'';
  });
  return map;
}

function buildPageContent(el,channelName){
  var userChans=getUserChannels();
  var pool;
  if(channelName==='all'){
    pool=allCards.filter(function(c){return userChans.indexOf(c.channel)!==-1;});
  }else{
    pool=allCards.filter(function(c){return c.channel===channelName;});
  }
  pool.forEach(function(c){c._pScore=personalScore(c);});
  var runTimestamps=buildRunTimestamps();
  var groups={};
  pool.forEach(function(c){
    var run=c.pipelineRun||'unknown';
    if(!groups[run])groups[run]=[];
    groups[run].push(c);
  });
  var runDates=Object.keys(groups).sort(function(a,b){return b.localeCompare(a);});
  el.innerHTML='';
  if(runDates.length===0){
    var isCustom=channelName!=='all'&&CHANNEL_DEFS.every(function(c){return c.name!==channelName;});
    var emptyMsg=isCustom
      ?'Your <em>'+escHtml(channelName)+'</em> channel is ready.<br>Fresh cards will appear at the next pipeline run — check back soon.'
      :'No cards yet.';
    el.innerHTML='<div class="empty-state">'+emptyMsg+'</div>';
    appendSurvey(el);
    return;
  }
  runDates.forEach(function(runDate,i){
    var batch=groups[runDate];
    batch.sort(function(a,b){return b._pScore-a._pScore;});
    if(channelName!=='all'){batch=batch.slice(0,10);}
    if(i>0){
      var divider=document.createElement('div');
      divider.className='run-divider';
      divider.innerHTML='<div class="run-divider-line"></div>'+
        '<span class="run-divider-label">'+escHtml(formatRunLabel(runDate,runTimestamps[runDate]||''))+'</span>'+
        '<div class="run-divider-line"></div>';
      el.appendChild(divider);
    }
    batch.forEach(function(c){
      var card=createCardEl(c);
      el.appendChild(card);
      cardObserver.observe(card);
    });
  });
  appendSurvey(el);
  // Check channel complete
  if(channelName!=='all'&&pool.length>0){
    checkChannelComplete(channelName,pool);
  }
}

function renderFeed(){
  buildPageContent(document.getElementById('pageCurrent'),activeChannel);
}

// ─── Feed survey ────────────────────────────────────────────────────────────────
function appendSurvey(el){
  var div=document.createElement('div');
  div.className='feed-survey';
  div.id='feedSurvey';
  if(surveyAnsweredToday){
    div.innerHTML='<div class="feed-survey-q" style="color:#333">Thanks for the feedback.</div>';
  }else{
    div.innerHTML=
      '<div class="feed-survey-q">Better than headlines?</div>'+
      '<div class="feed-survey-btns">'+
        '<button class="feed-survey-btn" onclick="submitSurvey(\'yes\',this)">Yes</button>'+
        '<button class="feed-survey-btn" onclick="submitSurvey(\'same\',this)">Same</button>'+
        '<button class="feed-survey-btn" onclick="submitSurvey(\'worse\',this)">Worse</button>'+
      '</div>';
  }
  el.appendChild(div);
}

async function checkSurveyAnswered(){
  if(!sb||!currentUser)return;
  var today=new Date().toISOString().split('T')[0];
  try{
    var res=await sb.from('feed_surveys').select('response').eq('user_id',currentUser.id).eq('date',today).maybeSingle();
    if(!res.error&&res.data){
      surveyAnsweredToday=true;
      var s=document.getElementById('feedSurvey');
      if(s)s.innerHTML='<div class="feed-survey-q" style="color:#333">Thanks for the feedback.</div>';
    }
  }catch(e){}
}

function submitSurvey(response,btn){
  surveyAnsweredToday=true;
  var survey=btn.closest('.feed-survey');
  if(survey)survey.innerHTML='<div class="feed-survey-q" style="color:#333">Thanks for the feedback.</div>';
  if(!sb||!currentUser)return;
  var today=new Date().toISOString().split('T')[0];
  sb.from('feed_surveys').upsert({user_id:currentUser.id,date:today,response:response},{onConflict:'user_id,date'}).then(function(){});
}

function checkChannelComplete(channel,pool){
  // Record channel_complete if all cards in this channel have been seen
  var allSeen=pool.every(function(c){return seenCardUrls.has(c.url);});
  if(allSeen&&pool.length>0){
    recordSignal('channel_complete',pool[0],{});
  }
}

// ─── Card creation ──────────────────────────────────────────────────────────────
function buildBylineHtml(c){
  var key=(c.author||'')+'|'+c.source;
  var jFollowed=!!followedJournalists[key];
  var pFollowed=!!followedPublications[c.source];
  var pubPart=pFollowed?'<span style="color:#4CAF50">'+escHtml(c.source)+'</span>':escHtml(c.source);
  if(c.author&&c.author!=='Unknown'){
    var authorPart=jFollowed?'<span style="color:#4CAF50">'+escHtml(c.author)+'</span>':escHtml(c.author);
    return authorPart+' · '+pubPart;
  }
  return pubPart;
}

function createCardEl(c){
  var isLiked=likedUrls.has(c.url);
  var hasAuthor=c.author&&c.author!=='Unknown';
  var jDisplayName=hasAuthor?c.author:'Unknown Author';
  var jInit=hasAuthor?c.author.split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase():'?';
  var pInit=c.source.split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
  var jKey=(c.author||'')+'|'+c.source;
  var jFollowed=!!followedJournalists[jKey];
  var pFollowed=!!followedPublications[c.source];
  var jAvatarStyle=jFollowed?' style="border:2px solid #4CAF50;"':'';
  var pAvatarStyle=pFollowed?' style="border:2px solid #4CAF50;"':'';

  var div=document.createElement('div');
  div.className='feed-card';
  div.dataset.url=c.url;
  div.innerHTML=
    '<div class="feed-card-channel">'+escHtml(c.channel)+'</div>'+
    '<div class="feed-card-insight">'+escHtml(c.insight)+'</div>'+
    '<div class="feed-card-meta">'+
      '<div class="feed-card-byline">'+buildBylineHtml(c)+'</div>'+
      '<button class="like-btn'+(isLiked?' liked':'')+'" data-action="like">♡</button>'+
    '</div>'+
    '<div class="feed-card-expanded">'+
      (c.title?'<div class="feed-card-title">'+escHtml(c.title)+'</div>':'')+
      (c.context?'<div class="feed-card-context">'+escHtml(c.context)+'</div>':'')+
      '<div class="entity-btns">'+
        '<button class="journalist-btn" data-action="journalist">'+
          '<div class="journalist-avatar"'+jAvatarStyle+'>'+escHtml(jInit)+'</div>'+
          '<div class="journalist-info"><div class="journalist-name-text">'+escHtml(jDisplayName)+'</div></div>'+
          '<span class="journalist-arrow">›</span>'+
        '</button>'+
        '<button class="journalist-btn" data-action="publication">'+
          '<div class="journalist-avatar"'+pAvatarStyle+'>'+escHtml(pInit)+'</div>'+
          '<div class="journalist-info"><div class="journalist-name-text">'+escHtml(c.source)+'</div></div>'+
          '<span class="journalist-arrow">›</span>'+
        '</button>'+
      '</div>'+
      '<a class="read-link" href="'+escHtml(c.url)+'" target="_blank" data-action="read">Read full article →</a>'+
    '</div>';

  attachCardHandlers(div,c);
  return div;
}

function attachCardHandlers(div,c){
  div.addEventListener('click',function(e){
    if(e.target.closest('[data-action="journalist"]')){openJournalist(c);return;}
    if(e.target.closest('[data-action="publication"]')){openPublication(c);return;}
    if(e.target.closest('[data-action="like"]')){toggleLike(div,c);return;}
    if(e.target.closest('[data-action="read"]')){
      recordSignal('click_through',c,{});
      sessionData.article_clicks++;
      return;
    }
    toggleExpand(div,c);
  });
}

function toggleExpand(div,c){
  var exp=div.querySelector('.feed-card-expanded');
  if(!exp)return;
  var isOpen=exp.classList.contains('open');
  if(!isOpen){
    exp.classList.add('open');
    if(c){expandStartTime[c.url]=Date.now();sessionData.expands++;}
  }else{
    exp.classList.remove('open');
    if(c&&expandStartTime[c.url]){
      var dwell=(Date.now()-expandStartTime[c.url])/1000;
      delete expandStartTime[c.url];
      if(dwell>=2)recordSignal('dwell',c,{dwell_seconds:Math.round(dwell)});
    }
  }
}

function toggleLike(div,c){
  var btn=div.querySelector('[data-action="like"]');
  if(likedUrls.has(c.url)){
    likedUrls.delete(c.url);
    savedCards=savedCards.filter(function(s){return s.url!==c.url;});
    if(btn)btn.className='like-btn';
    if(sb&&currentUser)sb.from('user_likes').delete().eq('user_id',currentUser.id).eq('card_url',c.url).then(function(){});
  }else{
    likedUrls.add(c.url);
    if(!savedCards.find(function(s){return s.url===c.url;})){savedCards.push({url:c.url,card:c});}
    if(btn)btn.className='like-btn liked';
    if(sb&&currentUser)sb.from('user_likes').upsert({user_id:currentUser.id,card_url:c.url}).then(function(){});
    recordSignal('like',c,{});
    sessionData.likes++;
  }
}

// ─── Channel navigation ─────────────────────────────────────────────────────────
var navLock=false;

function navigateChannel(dir,W,preBuiltPage){
  if(navLock)return;
  navLock=true;
  var page=document.getElementById('pageCurrent');
  if(!W)W=document.getElementById('feedContent').offsetWidth;
  try{
    var channels=getChannelList();
    var idx=Math.max(0,channels.indexOf(activeChannel));
    var nextIdx=(idx+dir+channels.length)%channels.length;
    activeChannel=channels[nextIdx];
    document.querySelectorAll('.channel-btn').forEach(function(b){b.classList.remove('active');});
    var btns=document.querySelectorAll('.channel-btn');
    if(btns[nextIdx]){btns[nextIdx].classList.add('active');btns[nextIdx].scrollIntoView({block:'nearest',inline:'center'});}
    if(preBuiltPage){
      page.style.transition='transform 0.22s ease-out';
      page.style.transform='translateX('+(dir>0?-W:W)+'px)';
      preBuiltPage.style.transition='transform 0.22s ease-out';
      preBuiltPage.style.transform='translateX(0)';
      setTimeout(function(){
        try{
          page.innerHTML='';page.style.transition='none';page.style.transform='translateX(0)';
          while(preBuiltPage.firstChild)page.appendChild(preBuiltPage.firstChild);
          if(preBuiltPage.parentNode)preBuiltPage.parentNode.removeChild(preBuiltPage);
          navLock=false;
        }catch(e){
          buildPageContent(page,activeChannel);page.style.transition='none';page.style.transform='translateX(0)';navLock=false;
        }
      },240);
    }else{
      page.style.transition='transform 0.18s ease-in';
      page.style.transform='translateX('+(dir>0?-W:W)+'px)';
      setTimeout(function(){
        try{
          buildPageContent(page,activeChannel);
          page.style.transition='none';page.style.transform='translateX('+(dir>0?W:-W)+'px)';
          requestAnimationFrame(function(){requestAnimationFrame(function(){
            page.style.transition='transform 0.22s ease-out';page.style.transform='translateX(0)';
            setTimeout(function(){navLock=false;},240);
          });});
        }catch(e){page.style.transition='none';page.style.transform='translateX(0)';navLock=false;}
      },190);
    }
  }catch(err){page.style.transition='none';page.style.transform='translateX(0)';navLock=false;}
}

(function(){
  var startX=0,startY=0,startTime=0,lock=null,W=0;
  var neighborDir=0,pageNeighbor=null;
  var content=document.getElementById('feedContent');
  var page=document.getElementById('pageCurrent');

  function destroyNeighbor(){
    if(pageNeighbor&&pageNeighbor.parentNode)pageNeighbor.parentNode.removeChild(pageNeighbor);
    pageNeighbor=null;neighborDir=0;
  }

  content.addEventListener('touchstart',function(e){
    if(navLock)return;
    startX=e.touches[0].clientX;startY=e.touches[0].clientY;
    startTime=Date.now();lock=null;W=content.offsetWidth;
    page.style.transition='none';destroyNeighbor();
  },{passive:true});

  content.addEventListener('touchmove',function(e){
    if(navLock)return;
    var dx=e.touches[0].clientX-startX;
    var dy=e.touches[0].clientY-startY;
    if(!lock&&(Math.abs(dx)>8||Math.abs(dy)>8)){
      lock=Math.abs(dx)>Math.abs(dy)?'h':'v';
      if(lock==='h'){
        neighborDir=dx<0?1:-1;
        var channels=getChannelList();
        var idx=Math.max(0,channels.indexOf(activeChannel));
        var nextIdx=(idx+neighborDir+channels.length)%channels.length;
        pageNeighbor=document.createElement('div');
        pageNeighbor.className='feed-page';
        pageNeighbor.style.cssText='position:absolute;inset:0;overflow-y:hidden;padding:10px 16px 32px;transform:translateX('+(neighborDir>0?W:-W)+'px);transition:none;pointer-events:none;';
        content.appendChild(pageNeighbor);
        buildPageContent(pageNeighbor,channels[nextIdx]);
      }
    }
    if(lock==='h'){
      e.preventDefault();
      page.style.transform='translateX('+dx+'px)';
      if(pageNeighbor)pageNeighbor.style.transform='translateX('+(dx+(neighborDir>0?W:-W))+'px)';
    }
  },{passive:false});

  content.addEventListener('touchend',function(e){
    if(navLock||lock!=='h'){destroyNeighbor();return;}
    try{
      var dx=e.changedTouches[0].clientX-startX;
      var elapsed=Date.now()-startTime;
      var velocity=elapsed>0?Math.abs(dx)/elapsed:0;
      var goNext=dx<-(W*0.28)||(dx<-20&&velocity>0.3);
      var goPrev=dx>(W*0.28)||(dx>20&&velocity>0.3);
      if(goNext&&neighborDir===1){var nb=pageNeighbor;pageNeighbor=null;navigateChannel(1,W,nb);}
      else if(goPrev&&neighborDir===-1){var nb=pageNeighbor;pageNeighbor=null;navigateChannel(-1,W,nb);}
      else{
        page.style.transition='transform 0.28s ease-out';page.style.transform='translateX(0)';
        if(pageNeighbor){
          pageNeighbor.style.transition='transform 0.28s ease-out';
          pageNeighbor.style.transform='translateX('+(neighborDir>0?W:-W)+'px)';
          var nb=pageNeighbor;pageNeighbor=null;
          setTimeout(function(){if(nb.parentNode)nb.parentNode.removeChild(nb);},300);
        }
      }
    }catch(err){page.style.transition='none';page.style.transform='translateX(0)';destroyNeighbor();}
  },{passive:true});

  content.addEventListener('touchcancel',function(){
    lock=null;page.style.transition='transform 0.22s ease-out';page.style.transform='translateX(0)';
    if(pageNeighbor){
      pageNeighbor.style.transition='transform 0.22s ease-out';
      pageNeighbor.style.transform='translateX('+(neighborDir>0?W:-W)+'px)';
      var nb=pageNeighbor;pageNeighbor=null;
      setTimeout(function(){if(nb.parentNode)nb.parentNode.removeChild(nb);},250);
    }
    neighborDir=0;
  },{passive:true});
})();

// ─── Refresh timer ──────────────────────────────────────────────────────────────
var timerLoading=false;
function getNextRunMs(){
  var etDate=new Date(Date.now()-(4*3600*1000));
  var cur=etDate.getUTCHours()*3600+etDate.getUTCMinutes()*60+etDate.getUTCSeconds();
  var next=[6*3600,16*3600].find(function(t){return t>cur;});
  return((next!==undefined?next:30*3600)-cur)*1000;
}
function updateTimer(){
  if(timerLoading)return;
  var el=document.getElementById('refreshTimer');
  if(!el)return;
  var ms=getNextRunMs();
  if(ms<5000){
    timerLoading=true;el.textContent='Refreshing...';
    loadCards().then(function(){timerLoading=false;},function(){timerLoading=false;});return;
  }
  var sec=Math.floor(ms/1000);
  var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  el.textContent='Next refresh in '+(h>0?h+'h '+m+'m':m>0?m+'m '+s+'s':s+'s');
}
setInterval(updateTimer,1000);
updateTimer();

// ─── Init ───────────────────────────────────────────────────────────────────────
initAuth();
</script>
</body>
